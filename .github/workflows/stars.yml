name: Update star total

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sum stars of public non-fork repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api --paginate "users/${GITHUB_REPOSITORY_OWNER}/repos?per_page=100&type=owner" \
            | jq -s '[.[][] | select(.fork == false) | .stargazers_count] | add')
          jq -n --arg total "$total" \
            '{schemaVersion: 1, label: "total stars", message: $total, color: "58A6FF"}' > stars.json
      - name: Commit if changed
        run: |
          git diff --quiet -- stars.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stars.json
          git commit -m "chore: update star total"
          git push
